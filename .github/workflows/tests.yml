# The test suite is the repository's only executable contract: every push and pull request runs
# it. Read-only token, pinned checkout, no other third-party action.
name: tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - run: python3 -m unittest discover -s tests
